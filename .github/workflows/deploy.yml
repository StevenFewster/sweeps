name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # schedule:  # Disabled — competition closed until new season
  #   - cron: '0 2 * * 0'  # 2am on Sunday
  #   - cron: '0 2 * * 1'  # 2am on Monday
  #   - cron: '0 2 * * 2'  # 2am on Tuesday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate scores
        run: npm run update

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/scores-wc-2026.json public/wc-table.json
          git diff --cached --quiet || git commit -m "chore: update wc scores and table [skip ci]"
          git push

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
